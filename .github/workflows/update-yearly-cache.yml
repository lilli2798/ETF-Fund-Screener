name: Update Yearly Returns Cache

on:
  schedule:
    # January 2nd at 12:00 UTC every year. Running on Jan 1 at 00:00 UTC is
    # only 3 hours after the US close on Dec 31, before Yahoo has settled the
    # final prices, and midnight UTC is GitHub's busiest (most delayed) slot.
    - cron: '0 12 2 1 *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # ~5,000 tickers in rate-limited batches can take a while
    permissions:
      contents: write

    defaults:
      run:
        working-directory: etf_screener/yahoo_returns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: .
        run: pip install -r requirements.txt

      # Appends last year's returns for every cached ticker (incl. ^GSPC/^DJI/^IXIC),
      # downloads any tickers in sources/tickers.txt not in the cache yet, and
      # retries empty rows.
      - name: Update yearly returns cache
        run: python yearly_cache_manager.py

      - name: Commit and push cache update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/etf_yearly_history.csv
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update yearly returns cache for $(date +'%Y') [skip ci]"
            # The daily screener may have pushed while this job was running.
            git pull --rebase
            git push
          fi
