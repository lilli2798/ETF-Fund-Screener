name: Cleanup Workflow Runs

on:
  schedule:
    - cron: '0 0 1 * *'  # First day of each month at midnight UTC
  workflow_dispatch:

jobs:
  cleanup_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate with GitHub
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Delete old workflow runs (keep last 10 per workflow)
        run: |
          # This script cleans up old GitHub Actions workflow runs to save storage and keep the workflow history clean.
          # It keeps the last 10 runs for each workflow and deletes any older runs.
          # This is done per workflow, so each workflow (daily-etf-screener, monthly-rating-update, etc.) maintains its own history.
          
          # Step 1: Get all workflow names and their IDs from the repository
          gh workflow list --json name,id --jq '.[]' > /tmp/workflows.json
          
          # Step 2: Process each workflow individually
          jq -c '.' /tmp/workflows.json | while IFS= read -r WORKFLOW; do
            WORKFLOW_NAME=$(echo "$WORKFLOW" | jq -r '.name')
            WORKFLOW_ID=$(echo "$WORKFLOW" | jq -r '.id')
            
            echo "Processing workflow: $WORKFLOW_NAME (ID: $WORKFLOW_ID)"
            
            # Step 3: Get all runs for this specific workflow (up to 100 most recent)
            RUNS=$(gh run list --workflow="$WORKFLOW_ID" --json databaseId,name,createdAt --limit 100 --jq '.[]')
            
            # Step 4: Count total runs for this workflow
            TOTAL=$(echo "$RUNS" | jq 'length')
            echo "  Total runs for $WORKFLOW_NAME: $TOTAL"
            
            # Step 5: If more than 10 runs exist, delete the older ones
            if [ "$TOTAL" -gt 10 ]; then
              DELETE_COUNT=$((TOTAL - 10))
              echo "  Deleting $DELETE_COUNT old runs from $WORKFLOW_NAME..."
              
              # Get IDs of runs to delete (all except the last 10, reversed to delete oldest first)
              DELETE_IDS=$(echo "$RUNS" | jq -r 'reverse | .[10:] | .[].databaseId')
              
              # Step 6: Delete each old run individually
              for ID in $DELETE_IDS; do
                echo "    Deleting run ID: $ID"
                gh run delete "$ID" || echo "    Failed to delete run $ID"
              done
              
              echo "  Deleted $DELETE_COUNT runs from $WORKFLOW_NAME"
            else
              echo "  Less than or equal to 10 runs, nothing to delete"
            fi
          done
          
          # Cleanup temp file
          rm /tmp/workflows.json
