# ============================================================================
# ETF Fund Screener - Profile A Configuration
# ============================================================================
#
# This file controls how the screener analyzes and ranks ETFs.
# Profile A is designed for long-term, low-risk, steady-return investing.
#
# QUICK START:
# 1. Update the file paths below to point to your Morningstar Excel exports
# 2. Adjust the thresholds and weights to match your preferences
# 3. Run: python main.py
# 4. When prompted, enter the path to this YAML file
#
# ============================================================================

# Which investment profile to use (A = long-term, low-risk strategy)
profile: A

# INPUT FILES: Point this to your Morningstar Excel export directory
data_path: data/   # Contains all Morningstar data files (performance + structural combined)

# OUTPUT: Where to save the results Excel file
out_path: ../output/etf_screener

# ============================================================================
# FILTERS & THRESHOLDS
# ============================================================================
# These settings control which ETFs are eligible for analysis.
# Funds that don't meet these criteria are excluded before scoring.
# ============================================================================

thresholds:
  # CATEGORY FILTER
  require_category: false            # Only include funds with a Morningstar Category assigned

  # COST FILTERS
  max_expense_ratio: 1.75           # Maximum expense ratio (0.75% = 0.0075 as decimal)
                                    # Set lower to only consider very low-cost funds

  # SIZE FILTERS
  require_fund_size: false           # Require funds to meet minimum size threshold
  min_fund_size: null               # Minimum fund size in dollars (null = no minimum)
                                    # Example: 100000000 for $100M minimum

  # PERFORMANCE FILTERS
  require_3y_return: false           # Only include funds with 3-year return history
  min_3y_return: null               # Minimum 3-year annualized return (null = no minimum)
                                    # Example: 0.05 for 5% minimum annual return

  # STRUCTURAL EXCLUSIONS (Hard filters - these funds are dropped entirely)
  # Leveraged funds use debt to amplify returns (e.g., 2x, 3x funds) - higher risk
  exclude_leveraged_funds: false     # Exclude leveraged/inverse ETFs

  # Interval funds only allow redemptions at scheduled intervals - less liquid
  exclude_interval_funds: false       # Exclude interval funds

  # Tender offer funds have limited redemption options - less liquid
  exclude_tender_offer_funds: false  # Exclude funds with active tender offers

  # ============================================================================
  # SCORING WEIGHTS
  # ============================================================================
  # These control how much each scoring dimension counts in the final score.
  # Higher values = that dimension is more important to you.
  # All weights should sum to approximately 1.0 (100%).
  #
  # You can omit any section here - it will use the default values from config.py
  #
  # MORNINGSTAR LONG-TERM CRITERIA (recommended by Morningstar):
  # To use Morningstar's recommended long-term investment weights, replace the
  # weights section below with:
  #
  #   weights:
  #     performance: 0.45      # Combined 5Y (25%) + 10Y (20%) returns
  #     risk_adjusted: 0.20    # 3Y Sharpe ratio
  #     volatility: 0.15        # Drawdown (3Y and 5Y)
  #     quality_valuation: 0.10 # Quality metrics
  #     costs: 0.10            # Expense ratio
  #     tracking: 0.00         # Not used
  #     liquidity_size: 0.00    # Not used
  #     tax_income: 0.00       # Not used
  #
  # And update concept_weights (see below) to match Morningstar's emphasis.
  # ============================================================================

  weights:
    # How much historical returns matter (25% of total score)
    performance: 0.35

    # How much risk-adjusted performance matters (20% of total score)
    risk_adjusted: 0.15

    # How much volatility/downside risk matters (15% of total score)
    volatility: 0.10

    # How much tracking error matters (5% of total score)
    # Lower tracking error = fund follows its benchmark more closely
    tracking: 0.05

    # How much fund size and trading volume matter (5% of total score)
    liquidity_size: 0.05

    # How much portfolio quality and valuation matter (10% of total score)
    quality_valuation: 0.15
    costs: 0.10
    tax_income: 0.05

  # ============================================================================
  # DETAILED WEIGHTS WITHIN EACH SCORING DIMENSION
  # ============================================================================
  # These fine-tune how individual metrics are combined within each dimension.
  # Each section should sum to approximately 1.0.
  #
  # TIP: You can override just ONE value (e.g., only return_3y) and all other
  # values in that section will use their defaults. This makes it easy to
  # experiment with small adjustments without changing everything.
  #
  # MORNINGSTAR LONG-TERM CONCEPT WEIGHTS:
  # To use Morningstar's criteria, replace the concept_weights section below with:
  #
  #   concept_weights:
  #     performance:
  #       return_5y: 0.56      # 5Y returns (55.6% of performance weight)
  #       return_10y: 0.44     # 10Y returns (44.4% of performance weight)
  #       return_3y: 0.00      # Not emphasized
  #       return_1y: 0.00      # Not emphasized for long-term
  #       rank_3y: 0.00        # Not used
  #     risk_adjusted:
  #       sharpe_3y: 1.00      # 100% on 3Y Sharpe
  #       sharpe_1y: 0.00      # Not used
  #       upside: 0.00         # Not used
  #       downside: 0.00       # Not used
  #     volatility:
  #       stdev_3y: 0.00      # Not used
  #       drawdown_3y: 0.50   # 3Y drawdown (50% of volatility weight)
  #       drawdown_5y: 0.50   # 5Y drawdown (50% of volatility weight)
  #     quality_valuation:
  #       growth_grade: 0.40   # Growth grade (40% of quality weight)
  #       financial_health: 0.40 # Financial health (40% of quality weight)
  #       price_fair_value: 0.20 # Price vs fair value (20% of quality weight)
  #       medalist: 0.00       # Not used
  #     costs:
  #       net_expense_ratio: 1.00 # 100% on expense ratio
  #       management_fee: 0.00    # Not used
  # ============================================================================

  concept_weights:
    # PERFORMANCE: How different time periods are weighted
    performance:
      return_10y: 0.20     # 10-year returns (optional for long-term focus)
      return_5y: 0.35      # 5-year returns (second most important)
      return_3y: 0.20      # 3-year returns (most important)
      return_1y: 0.10      # 1-year returns (less important for long-term)
      rank_3y: 0.15        # 3-year category ranking (vs peers)

    # RISK-ADJUSTED: How different risk metrics are weighted
    risk_adjusted:
      sharpe_3y: 0.45      # 3-year Sharpe ratio (return per unit of risk)
      sharpe_1y: 0.10      # 1-year Sharpe ratio
      upside: 0.25         # Upside capture (how well fund gains in up markets)
      downside: 0.20        # Downside capture (how well fund protects in down markets)

    # VOLATILITY: How different volatility measures are weighted
    volatility:
      stdev_3y: 0.35       # 3-year standard deviation (price volatility)
      drawdown_3y: 0.35    # 3-year maximum drawdown (largest peak-to-trough decline)
      drawdown_5y: 0.30    # 5-year maximum drawdown

    # TRACKING: How tracking error over different periods is weighted
    # Low tracking error: The fund closely follows its benchmark.
    # Moderate to high tracking error: The fund's returns differ more from the benchmark.
      # This may be expected if the fund uses active management, a concentrated strategy, derivatives, factor tilts,
      # or holds securities that differ from the index
    tracking:
      tracking_error_3y: 0.55   # 3-year tracking error (deviation from benchmark)
      tracking_error_1y: 0.45   # 1-year tracking error

    # LIQUIDITY & SIZE: How size vs trading volume are weighted
    liquidity_size:
      fund_size: 0.60        # Total assets under management (AUM)
      trading_volume: 0.40   # Average daily trading volume

    # QUALITY & VALUATION: How different quality metrics are weighted
    quality_valuation:
      growth_grade: 0.2         # Portfolio growth grade (A-F)
      financial_health: 0.2     # Portfolio financial health grade (A-F)
      price_fair_value: 0.25     # Price vs Morningstar's fair value estimate
      medalist: 0.2             # Morningstar Medalist rating (Gold/Silver/Bronze)
      economic_moat_wide: 0.15   # Portfolio Economic Moat Coverage (Wide) - % of holdings with wide economic moat

    # COSTS: How different fee measures are weighted
    costs:
      net_expense_ratio: 0.75    # Net expense ratio (after fee waivers) - most important
      management_fee: 0.25       # Management fee portion

    # TAX & INCOME: How tax efficiency vs yield are weighted
    tax_income:
      tax_cost_ratio: 0.55      # Tax cost ratio (how much taxes reduce returns)
      sec_yield: 0.45           # SEC 30-day yield (standardized dividend yield)


