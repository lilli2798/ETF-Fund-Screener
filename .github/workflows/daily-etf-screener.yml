name: Daily ETF Screener

on:
  schedule:
    - cron: '0 0 * * *'  # ~8 PM ET (varies by DST)
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required so the bot commit can push back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache data files
        uses: actions/cache@v4
        with:
          path: etf_screener/data/
          key: etf-data-${{ runner.os }}-${{ hashFiles('etf_screener/data/**') }}
          restore-keys: |
            etf-data-${{ runner.os }}-

      - name: Check for data files
        working-directory: etf_screener
        run: |
          if [ ! -d "data" ] || [ -z "$(ls -A data/*.xlsx 2>/dev/null)" ]; then
            echo "Warning: No data files found in etf_screener/data/"
            echo "Please upload Morningstar Excel files to the etf_screener/data/ directory"
            echo "You can do this by:"
            echo "  1. Running the workflow manually with data files present"
            echo "  2. Or committing data files to the repository"
            exit 1
          fi

      - name: Run screener pipeline
        working-directory: etf_screener
        run: python run_ci.py

      - name: Send alerts
        working-directory: etf_screener
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python alerts.py

      - name: Commit updated sub-sector cache
        run: |
          git config user.name "etf-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add etf_screener/utils/sector_cache.json
          git diff --cached --quiet || git commit -m "Update Yahoo sub-sector cache [skip ci]"
          git push

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-screener-output
          path: output/etf_screener/*.xlsx

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-screener-database
          path: data/etf_screener.db
          retention-days: 30
