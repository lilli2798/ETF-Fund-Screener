# ============================================================================
# ETF Fund Screener - Long-Term Profile (LT)
# ============================================================================
#
# This file controls how the screener analyzes and ranks ETFs.
# The long-term profile is designed for long-term, low-risk, steady-return
# investing. Its short-term counterpart is profile_short_term.yaml.
#
# QUICK START:
# 1. Update the file paths below to point to your Morningstar Excel exports
# 2. Adjust the thresholds and weights to match your preferences
# 3. Run: python main.py   (enter input_files/profile_long_term.yaml when asked)
#    or:  python run_ci.py  (every profile_*.yaml in input_files/, one report)
#
# Every setting must be here: there are no hidden defaults, and a missing or
# misspelled key stops the run with its name. To add a profile, copy this
# file to input_files/profile_<name>.yaml and change `profile:`.
#
# ============================================================================

# Profile key: names its score columns (Profile LT Score, ...) and
# the report (results_profile_LT_ST_... when run with the other profiles,
# results_profile_LT_... when run alone). Must be unique across the
# profile_*.yaml files.
profile: LT
# enabled: false   # uncomment to keep this file without running it

# Selection cutoffs. Top level, NOT under thresholds:.
top_n_per_category: 5   # funds per Morningstar Category with Selected Flag = 1
top_n_overall: 100        # funds across ALL categories with Selected Overall Flag = 1

# INPUT FILES: Point this to your Morningstar Excel export directory
data_path: data/   # Contains all Morningstar data files (performance + structural combined)

# OUTPUT: Where to save the results Excel file
out_path: ../output/etf_screener

# ============================================================================
# SCORING
# ============================================================================

thresholds:
  # This profile only SCORES funds; it never removes one. Rules for every
  # profile (no loads or redemption fee, minimum investment <= $50,000) are
  # PURCHASE_RULES in config.py. To make something not count, set its weight
  # to 0.0 below (e.g. expense ratio counts through weights.costs).


  weights:
    # How much historical returns matter (split into long-term and short-term)
    long_term_return_performance: 0.25 # Aggregates 1Y-20Y returns for consistent long-term performance
    short_term_return_performance: 0.05 # Aggregates 1W-YTD returns for recent momentum

    # How much risk-adjusted performance matters
    risk_adjusted: 0.20

    # How much volatility/downside risk matters
    volatility: 0.15

    # How consistently the fund beat the indexes, year by year and in the
    # S&P 500's volatile periods (crashes and recoveries)
    resilience: 0.10

    # How much tracking error matters
    # Lower tracking error = fund follows its benchmark more closely
    tracking: 0.05

    # How much fund size and trading volume matter
    liquidity_size: 0.05

    # How much portfolio quality and valuation matter
    quality_valuation: 0.10
    costs: 0.10
    tax_income: 0.00

  # ============================================================================
  # DETAILED WEIGHTS WITHIN EACH SCORING DIMENSION
  # ============================================================================
  # These fine-tune how individual metrics are combined within each dimension.
  # Each section should sum to approximately 1.0.
  #
  # Every key must be listed; set one to 0.0 to leave that metric out.
  #
  # MORNINGSTAR LONG-TERM CONCEPT WEIGHTS. To use them, replace the matching
  # blocks in concept_weights below. Blocks whose
  # concept weight is 0 above (short-term, tracking, liquidity, tax) don't
  # affect the score, so they can stay as they are.
  #
  # ============================================================================

  concept_weights:
    # LONG-TERM RETURN PERFORMANCE: Aggregates 1Y-20Y returns for consistent performance
    # Weighted toward full market cycles (5Y, 10Y, 15Y); 1Y-2Y count little
    # because the short-term profile covers recent results. Sums to 1.0.
    long_term_return_performance:
      return_1y: 0.03
      return_2y: 0.04
      return_3y: 0.08
      return_4y: 0.08
      return_5y: 0.15
      return_6y: 0.07
      return_7y: 0.07
      return_8y: 0.07
      return_9y: 0.07
      return_10y: 0.15
      return_15y: 0.12
      return_20y: 0.07  # few funds are 20 years old

    # SHORT-TERM RETURN PERFORMANCE: Aggregates 1W-YTD returns for recent momentum
    # Equal weights all available periods by default (sums to 1.0)
    short_term_return_performance:
      return_1w: 0.05   # 1/8 = 12.5%
      return_1m: 0.15   # 1/8 = 12.5%
      return_2m: 0.15   # 1/8 = 12.5%
      return_qtd: 0.15  # 1/8 = 12.5%
      return_3m: 0.15   # 1/8 = 12.5%
      return_6m: 0.12   # 1/8 = 12.5%
      return_9m: 0.1   # 1/8 = 12.5%
      return_ytd: 0.05  # 1/8 = 12.5%

    # RISK-ADJUSTED: How different risk metrics are weighted
    # Sums to 1.0. Longer periods (5Y, 10Y) cover more than one market cycle.
    risk_adjusted:
      sharpe_1y: 0.05      # Morningstar Sharpe ratio (return per unit of risk)
      sharpe_3y: 0.20
      sharpe_5y: 0.15
      sharpe_10y: 0.10
      upside: 0.10         # 3Y upside capture (how well fund gains in up markets)
      upside_1y: 0.00
      upside_5y: 0.00
      upside_10y: 0.00
      downside: 0.10       # 3Y downside capture (how well fund protects in down markets)
      downside_1y: 0.00
      downside_5y: 0.05
      downside_10y: 0.05
      # Yahoo Finance metrics (columns Sharpe 1y/3y, Z Score 1y/3y in the report).
      # 0.20 of 1.0 = 20% of the Risk-Adjusted score. Set to 0.0 to leave Yahoo out.
      yahoo_sharpe_3y: 0.05  # Yahoo 3-year Sharpe ratio (daily prices)
      yahoo_sharpe_1y: 0.05  # Yahoo 1-year Sharpe ratio
      yahoo_zscore_3y: 0.05  # 3Y Sharpe vs funds in the same Yahoo sub-sector
      yahoo_zscore_1y: 0.05  # 1Y Sharpe vs funds in the same Yahoo sub-sector

    # VOLATILITY: How different volatility measures are weighted
    # Sums to 1.0. Drawdown = largest peak-to-trough loss (closer to 0 is better).
    volatility:
      stdev_1y: 0.00       # standard deviation (price volatility)
      stdev_3y: 0.20
      stdev_5y: 0.15
      stdev_10y: 0.05
      drawdown_1y: 0.00    # maximum drawdown
      drawdown_3y: 0.20
      drawdown_5y: 0.25
      drawdown_10y: 0.15

    # RESILIENCE: consistency and crash results (sums to 1.0)
    resilience:
      yearly_beat_pct: 0.25          # % of calendar years the fund beat all indexes
      yearly_bottom_10_share: 0.15   # share of years in the bottom 10% (lower is better)
      volatile_beat_pct: 0.25        # % of volatile periods the fund beat all indexes
      volatile_bottom_10_share: 0.15 # share of volatile periods in the bottom 10% (lower is better)
      worst_3m_return: 0.20          # Worst Three Month Return (less negative is better)

    # TRACKING: How tracking error over different periods is weighted
    # Low tracking error: The fund closely follows its benchmark.
    # Moderate to high tracking error: The fund's returns differ more from the benchmark.
      # This may be expected if the fund uses active management, a concentrated strategy, derivatives, factor tilts,
      # or holds securities that differ from the index
    tracking:
      tracking_error_3y: 0.55   # 3-year tracking error (deviation from benchmark)
      tracking_error_1y: 0.45   # 1-year tracking error

    # LIQUIDITY & SIZE: How size vs trading volume are weighted
    liquidity_size:
      fund_size: 0.60        # Total assets under management (AUM)
      trading_volume: 0.40   # Average daily trading volume

    # QUALITY & VALUATION: How different quality metrics are weighted
    quality_valuation:
      growth_grade: 0.2         # Portfolio growth grade (A-F)
      financial_health: 0.15     # Portfolio financial health grade (A-F)
      profitability_grade: 0.15  # Portfolio profitability grade (A-F)
      price_fair_value: 0.15     # Price vs Morningstar's fair value estimate
      medalist: 0.15            # Morningstar Medalist rating (Gold/Silver/Bronze)
      star_rating: 0.15         # Morningstar Rating for Funds (star rating 1-5)
      economic_moat_wide: 0.05   # Portfolio Economic Moat Coverage (Wide) - % of holdings with wide economic moat

    # COSTS: How different fee measures are weighted
    costs:
      adjusted_expense_ratio: 1.0    # Adjusted expense ratio (comprehensive fee measure including all fees)

    # TAX & INCOME: How tax efficiency vs yield are weighted
    tax_income:
      tax_cost_ratio_1y: 0.20            # 1-year tax cost ratio (lower is better for tax efficiency)
      tax_cost_ratio_2y: 0.15            # 2-year tax cost ratio (lower is better for tax efficiency)
      dividend_per_share_trailing: 0.10 # Dividend per Share (Trailing Annual) - higher is better
      dividend_per_share_forward: 0.10  # Dividend per Share (Forward Annual) - higher is better
      dividend_per_share_1y_avg: 0.10   # Dividend per Share (1Y Avg) - higher is better
      dividend_per_share_3y_avg: 0.10   # Dividend per Share (3Y Avg) - higher is better
      sec_yield: 0.25                    # SEC 30-day yield (standardized dividend yield)


