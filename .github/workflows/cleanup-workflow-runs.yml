name: Cleanup Workflow Runs

# Keeps GitHub storage small: the last 10 runs of each workflow and the last
# 10 screener reports (etf-screener-output artifacts). Runs daily, a few hours
# after the Daily ETF Screener, so at most 10 reports are ever stored.
# (Reports on your own computer are pruned by the screener itself, see
# KEEP_LAST_REPORTS in etf_screener/config.py.)

on:
  schedule:
    - cron: '0 8 * * *'  # daily, 08:00 UTC
  workflow_dispatch:

env:
  KEEP: 10
  REPORT_ARTIFACT: etf-screener-output

jobs:
  cleanup_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Delete old workflow runs (keep the last 10 per workflow)
        run: |
          # gh lists runs newest first, so everything after the first $KEEP is older.
          # Deleting a run also deletes its artifacts (reports).
          gh workflow list --all --json id,name --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r WORKFLOW_ID WORKFLOW_NAME; do
            OLD_IDS=$(gh run list --workflow "$WORKFLOW_ID" --limit 1000 --json databaseId \
                        --jq ".[$KEEP:][].databaseId")
            COUNT=$(echo "$OLD_IDS" | grep -c . || true)
            echo "$WORKFLOW_NAME: deleting $COUNT old run(s)"
            for ID in $OLD_IDS; do
              gh run delete "$ID" || echo "  could not delete run $ID"
            done
          done

      - name: Delete old screener reports (keep the last 10)
        run: |
          # Catches any report artifacts left over after the run cleanup above.
          OLD_IDS=$(gh api --paginate "repos/$GH_REPO/actions/artifacts?name=$REPORT_ARTIFACT&per_page=100" \
                      --jq '.artifacts[] | [.created_at, .id] | @tsv' |
                    sort -r | tail -n +$((KEEP + 1)) | cut -f2)
          COUNT=$(echo "$OLD_IDS" | grep -c . || true)
          echo "$REPORT_ARTIFACT: deleting $COUNT old report(s)"
          for ID in $OLD_IDS; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$ID" || echo "  could not delete artifact $ID"
          done
